    - name: Create VoiceWakeService.java
      run: |
        cat > android/app/src/main/java/com/auraai/services/VoiceWakeService.java << 'EOF'
        package com.auraai.services;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.media.AudioFormat;
        import android.media.AudioRecord;
        import android.media.MediaRecorder;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class VoiceWakeService extends Service {
            private static final String CHANNEL_ID = "aura_voice_channel";
            private static final int NOTIFICATION_ID = 1;
            private AudioRecord audioRecord;
            private boolean isRecording = false;

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
                startForeground(NOTIFICATION_ID, createNotification());
                startWakeWordDetection();
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                        CHANNEL_ID,
                        "Aura AI Voice Service",
                        NotificationManager.IMPORTANCE_LOW
                    );
                    channel.setDescription("Listening for 'Hey Aura'");
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            private Notification createNotification() {
                return new NotificationCompat.Builder(this, CHANNEL_ID)
                    .setContentTitle("Aura AI")
                    .setContentText("Listening for 'Hey Aura'...")
                    .setSmallIcon(android.R.drawable.ic_mic_voice_search)
                    .setPriority(NotificationCompat.PRIORITY_LOW)
                    .build();
            }

            private void startWakeWordDetection() {
                int bufferSize = AudioRecord.getMinBufferSize(
                    16000,
                    AudioFormat.CHANNEL_IN_MONO,
                    AudioFormat.ENCODING_PCM_16BIT
                );
                audioRecord = new AudioRecord(
                    MediaRecorder.AudioSource.MIC,
                    16000,
                    AudioFormat.CHANNEL_IN_MONO,
                    AudioFormat.ENCODING_PCM_16BIT,
                    bufferSize
                );
                audioRecord.startRecording();
                isRecording = true;

                new Thread(() -> {
                    byte[] buffer = new byte[bufferSize];
                    while (isRecording) {
                        int read = audioRecord.read(buffer, 0, buffer.length);
                        if (read > 0) {
                            long sum = 0;
                            for (byte b : buffer) {
                                sum += Math.abs(b);
                            }
                            long average = sum / buffer.length;
                            if (average > 500) {
                                onWakeWordDetected();
                            }
                        }
                    }
                }).start();
            }

            private void onWakeWordDetected() {
                Intent intent = new Intent("com.auraai.WAKE_WORD");
                intent.putExtra("wakeWord", "aura");
                sendBroadcast(intent);
                
                Intent launchIntent = getPackageManager().getLaunchIntentForPackage("com.auraai");
                if (launchIntent != null) {
                    launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                    startActivity(launchIntent);
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onDestroy() {
                isRecording = false;
                if (audioRecord != null) {
                    audioRecord.stop();
                    audioRecord.release();
                }
                super.onDestroy();
            }
        }
        EOF

    - name: Create AutomationService.java
      run: |
        cat > android/app/src/main/java/com/auraai/services/AutomationService.java << 'EOF'
        package com.auraai.services;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.media.projection.MediaProjection;
        import android.media.projection.MediaProjectionManager;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;

        public class AutomationService extends Service {
            private static final String CHANNEL_ID = "aura_automation_channel";
            private static final int NOTIFICATION_ID = 2;
            private MediaProjectionManager mediaProjectionManager;
            private MediaProjection mediaProjection;

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
                startForeground(NOTIFICATION_ID, createNotification());
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                        CHANNEL_ID,
                        "Aura AI Automation",
                        NotificationManager.IMPORTANCE_LOW
                    );
                    channel.setDescription("Running automation tasks");
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }

            private Notification createNotification() {
                return new NotificationCompat.Builder(this, CHANNEL_ID)
                    .setContentTitle("Aura AI")
                    .setContentText("Running automation...")
                    .setSmallIcon(android.R.drawable.ic_menu_camera)
                    .setPriority(NotificationCompat.PRIORITY_LOW)
                    .build();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            @Override
            public void onDestroy() {
                if (mediaProjection != null) {
                    mediaProjection.stop();
                    mediaProjection = null;
                }
                super.onDestroy();
            }
        }
        EOF

    - name: Create BootReceiver.java
      run: |
        cat > android/app/src/main/java/com/auraai/receivers/BootReceiver.java << 'EOF'
        package com.auraai.receivers;

        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import com.auraai.services.VoiceWakeService;

        public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
                if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                    Intent serviceIntent = new Intent(context, VoiceWakeService.class);
                    context.startForegroundService(serviceIntent);
                }
            }
        }
        EOF

    - name: Create empty ic_launcher placeholder
      run: |
        # Create placeholder icons
        for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          echo '<?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/primary"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
        </adaptive-icon>' > android/app/src/main/res/$dir/ic_launcher.xml
        done

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AuraAI-v1.0.0
        path: android/app/build/outputs/apk/release/app-release.apk

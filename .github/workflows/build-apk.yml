# .github/workflows/build-apk.yml
name: Build Aura AI APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Node Modules
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Install Dependencies
      run: npm install

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

    - name: Prepare Android Keystore
      if: github.ref == 'refs/heads/main'
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: AuraAI-v1.0.0
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: AuraAI-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0
        name: Aura AI v1.0.0
        body: |
          🚀 **Aura AI v1.0.0**
          
          ## ✨ Features
          - 🎤 Voice Wake - Say "Hey Aura"
          - 💻 Code Generation with Gemini AI
          - 📱 WhatsApp Automation
          - 📨 Telegram Bot Builder
          - 🎨 AI Image Generation
          - 📂 File Management
          - ⚡ Phone Automation
          - 🔒 Premium Features
          - 🌍 Global Support
          
          ## 📱 Download
          - [Download APK](https://github.com/yourusername/aura-ai/releases/download/v1.0.0/app-release.apk)
          
          ## 📋 Installation
          1. Enable "Install from Unknown Sources"
          2. Download and install APK
          3. Open and say "Hey Aura"
        files: android/app/build/outputs/apk/release/app-release.apk

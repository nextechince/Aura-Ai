# .github/workflows/build-apk.yml
name: Build Aura AI APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Node Modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Create Android Directory Structure
      run: |
        mkdir -p android/app/src/main/java/com/auraai/services
        mkdir -p android/app/src/main/java/com/auraai/receivers
        mkdir -p android/app/src/main/res/drawable
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/xml
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        mkdir -p android/gradle/wrapper

    - name: Create settings.gradle
      run: |
        cat > android/settings.gradle << 'EOF'
        rootProject.name = 'AuraAI'
        apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); 
        applyNativeModulesSettingsGradle(settings)
        include ':app'
        includeBuild('../node_modules/@react-native/gradle-plugin')
        EOF

    - name: Create gradle.properties
      run: |
        cat > android/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
        org.gradle.parallel=true
        org.gradle.caching=true
        android.useAndroidX=true
        android.enableJetifier=true
        android.jetifier.ignorelist=base-foundation
        android.experimental.r8.dex-optimization=full
        android.enableDexingArtifactTransform.desugaring=false
        EOF

    - name: Create gradle-wrapper.properties
      run: |
        cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.1-all.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Create project build.gradle
      run: |
        cat > android/build.gradle << 'EOF'
        buildscript {
            ext {
                buildToolsVersion = "34.0.0"
                minSdkVersion = 24
                compileSdkVersion = 34
                targetSdkVersion = 34
                ndkVersion = "23.1.7779620"
                kotlinVersion = "1.8.0"
            }
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath("com.android.tools.build:gradle:7.3.1")
                classpath("com.facebook.react:react-native-gradle-plugin")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
            }
        }
        allprojects {
            repositories {
                mavenCentral()
                google()
                mavenLocal()
                maven { url "$rootDir/../node_modules/react-native/android" }
                maven { url "$rootDir/../node_modules/jsc-android/dist" }
                maven { url 'https://maven.google.com' }
                maven { url 'https://www.jitpack.io' }
                maven { url 'https://developer.huawei.com/repo/' }
            }
        }
        EOF

    - name: Create app build.gradle
      run: |
        cat > android/app/build.gradle << 'EOF'
        apply plugin: "com.android.application"
        apply plugin: "com.facebook.react"

        def enableSeparateBuildPerCPUArchitecture = false
        def enableProguardInReleaseBuilds = false

        android {
            compileSdkVersion 34

            defaultConfig {
                applicationId "com.auraai"
                minSdkVersion 24
                targetSdkVersion 34
                versionCode 1
                versionName "1.0.0"
                multiDexEnabled true
                vectorDrawables.useSupportLibrary = true
            }

            signingConfigs {
                debug {
                    storeFile file('debug.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
                release {
                    if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                        storeFile file(MYAPP_UPLOAD_STORE_FILE)
                        storePassword MYAPP_UPLOAD_STORE_PASSWORD
                        keyAlias MYAPP_UPLOAD_KEY_ALIAS
                        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                    }
                }
            }

            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled enableProguardInReleaseBuilds
                    proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
                }
            }

            splits {
                abi {
                    reset()
                    enable enableSeparateBuildPerCPUArchitecture
                    universalApk true
                    include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                }
            }

            packagingOptions {
                pickFirst 'lib/armeabi-v7a/libc++_shared.so'
                pickFirst 'lib/arm64-v8a/libc++_shared.so'
                pickFirst 'lib/x86/libc++_shared.so'
                pickFirst 'lib/x86_64/libc++_shared.so'
            }
        }

        dependencies {
            implementation "com.facebook.react:react-native:+"
            implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
            implementation "androidx.multidex:multidex:2.0.1"
            implementation 'com.google.android.gms:play-services-base:18.2.0'
            implementation 'com.google.android.gms:play-services-location:21.0.1'
            implementation 'com.google.android.material:material:1.10.0'
            implementation 'com.airbnb.android:lottie:6.1.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'com.google.code.gson:gson:2.10.1'
        }

        apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); 
        applyNativeModulesAppBuildGradle(project)
        EOF

    - name: Create proguard-rules.pro
      run: |
        cat > android/app/proguard-rules.pro << 'EOF'
        -keep class com.facebook.react.** { *; }
        -keep class com.facebook.hermes.** { *; }
        -keep class com.facebook.soloader.** { *; }
        -keep class com.google.android.gms.** { *; }
        -keep class * extends com.facebook.react.uimanager.ViewManager { public *; protected *; }
        -keepclasseswithmembers class * { native <methods>; }
        -keepattributes *Annotation*
        -keepattributes SourceFile,LineNumberTable
        -keep @com.facebook.react.ReactModule class * { *; }
        -keep @com.facebook.react.bridge.ReactContextBaseJavaModule class * { *; }
        -keep @com.facebook.react.bridge.ReactMethod class * { *; }
        -keep class com.google.generativeai.** { *; }
        -dontwarn okhttp3.**
        -dontwarn okio.**
        -keep class com.google.gson.** { *; }
        -keep class com.flutterwave.** { *; }
        -keep class androidx.** { *; }
        -dontwarn androidx.**
        -assumenosideeffects class android.util.Log {
            public static *** d(...);
            public static *** v(...);
        }
        EOF

